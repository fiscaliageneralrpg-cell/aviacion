<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión | Latin Aviation Network</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --black: #030305;
      --card: #0d0d12;
      --white: #ffffff;
      --white-soft: #cbd5e1;
      --gray: #64748b;
      --blue: #0066ff;
      --blue-light: #3399ff;
      --cyan: #00d4ff;
      --blue-glow: rgba(0, 102, 255, 0.45);
      --border: #1f2937;
      --transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--black);
      color: var(--white);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }
    a { text-decoration: none; color: inherit; }
    .container { max-width: 1100px; margin: 0 auto; padding: 0 24px; width: 100%; }

    .bg-login {
      position: fixed; inset: 0; z-index: -2;
      background-size: cover; background-position: center;
      background-image: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.8)),
        url("https://i.imgur.com/tnbKq4X.png");
      animation: bgZoom 25s ease-in-out infinite alternate;
    }
    @keyframes bgZoom { from { transform: scale(1); } to { transform: scale(1.1); } }
    .bg-glow {
      position: fixed; inset: 0; z-index: -1;
      background:
        radial-gradient(circle at 25% 30%, rgba(0,102,255,0.18) 0%, transparent 45%),
        radial-gradient(circle at 75% 70%, rgba(0,212,255,0.12) 0%, transparent 45%);
      background-attachment: fixed;
      animation: meshMove 20s ease-in-out infinite alternate;
    }
    @keyframes meshMove {
      0% { background-position: 0% 0%; }
      100% { background-position: 100% 100%; }
    }

    nav {
      position: sticky; top: 0; z-index: 100;
      backdrop-filter: blur(16px);
      background: rgba(3,3,5,0.85);
      border-bottom: 1px solid var(--border);
      padding: 1rem 0;
      animation: navDrop 0.7s ease-out;
    }
    @keyframes navDrop {
      from { transform: translateY(-100%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .nav-inner { display: flex; justify-content: space-between; align-items: center; }
    .logo-box { display: flex; align-items: center; gap: 10px; }
    .logo-img { width: 34px; height: 34px; object-fit: contain; }
    .logo-text {
      font-family: 'Orbitron', monospace; font-weight: 900; font-size: 1.2rem;
      background: linear-gradient(135deg, var(--white), var(--blue));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      animation: logoGlow 4s ease-in-out infinite alternate;
    }
    @keyframes logoGlow {
      from { filter: drop-shadow(0 0 0 rgba(0,102,255,0)); }
      to { filter: drop-shadow(0 0 10px rgba(0,102,255,0.6)); }
    }

    .login-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
    }
    .login-card {
      background: rgba(13,13,18,0.72);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 60px 50px;
      max-width: 460px;
      width: 100%;
      text-align: center;
      box-shadow: 0 40px 90px rgba(0,0,0,0.7);
      position: relative; overflow: hidden;
      opacity: 0; transform: translateY(40px);
      animation: fadeUp 0.9s ease-out 0.2s forwards;
    }
    .login-card::before {
      content: ''; position: absolute; inset: 0;
      border-radius: inherit; padding: 1px;
      background: linear-gradient(135deg, var(--blue), var(--cyan));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: destination-out;
      mask-composite: exclude;
      opacity: 0.5; pointer-events: none;
    }
    @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }

    .login-eyebrow {
      display: inline-block;
      font-family: 'Orbitron', monospace;
      font-size: 0.7rem; font-weight: 900; letter-spacing: 4px;
      text-transform: uppercase; color: var(--blue);
      margin-bottom: 16px; padding: 6px 18px;
      border: 1px solid rgba(0,102,255,0.3);
      border-radius: 50px; background: rgba(0,102,255,0.08);
      animation: glowPulse 3s ease-in-out infinite;
    }
    @keyframes glowPulse {
      0%, 100% { box-shadow: 0 0 15px rgba(0,102,255,0.25); }
      50% { box-shadow: 0 0 35px rgba(0,102,255,0.55); }
    }
    .login-card h1 {
      font-family: 'Orbitron', monospace;
      font-size: clamp(1.6rem, 5vw, 2.2rem);
      font-weight: 900; margin-bottom: 12px;
      background: linear-gradient(135deg, var(--white), var(--blue));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .login-card p {
      color: var(--white-soft);
      margin-bottom: 34px;
      font-size: 1rem;
    }
    .btn-discord {
      display: inline-flex; align-items: center; justify-content: center; gap: 12px;
      width: 100%;
      padding: 16px 30px;
      border-radius: 50px;
      background: linear-gradient(135deg, var(--blue), var(--blue-light));
      color: var(--white);
      font-weight: 800; font-size: 1rem;
      box-shadow: 0 14px 35px var(--blue-glow);
      transition: var(--transition);
      border: none; cursor: pointer;
    }
    .btn-discord:hover {
      transform: translateY(-4px) scale(1.02);
      box-shadow: 0 24px 45px rgba(0,102,255,0.6);
      filter: brightness(1.12);
    }
    .btn-discord svg { width: 22px; height: 22px; fill: currentColor; }
    .login-note {
      margin-top: 22px;
      color: var(--gray);
      font-size: 0.82rem;
    }

    footer {
      border-top: 1px solid var(--border);
      background: var(--black);
      padding: 20px 0;
      text-align: center;
    }
    .footer-text { color: var(--gray); font-size: 0.8rem; }
    .version {
      background: var(--card); border: 1px solid var(--border);
      padding: 3px 10px; border-radius: 6px;
      font-family: 'Orbitron', monospace; font-size: 0.7rem; color: var(--blue);
    }

    @media (max-width: 768px) {
      .login-card { padding: 40px 26px; }
      .logo-text { font-size: 1rem; }
    }
  </style>
</head>
<body>
  <div class="bg-login"></div>
  <div class="bg-glow"></div>

  <nav>
    <div class="nav-inner container">
      <a href="/" class="logo-box">
        <img src="https://i.imgur.com/V47UGra.png" alt="LAN Logo" class="logo-img" onerror="this.style.display='none'">
        <div class="logo-text">LATIN AVIATION NETWORK</div>
      </a>
    </div>
  </nav>

  <main class="login-wrap">
    <div class="login-card">
      <span class="login-eyebrow">Acceso seguro</span>
      <h1>Iniciar sesión</h1>
      <p>Accede a Latin Aviation Network con tu cuenta de Discord. Tus datos se usan solo para verificar tu identidad.</p>
      <a href="/auth/discord/login" class="btn-discord">
        <svg viewBox="0 0 24 24"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128c.126-.094.252-.192.372-.291a.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>
        Sign In with Discord
      </a>
      <div class="login-note">Serás redirigido a Discord para autorizar el acceso.</div>
    </div>
  </main>

  <footer>
    <div class="container">
      <div class="footer-text">
        <span class="version">0.0.0.0.1</span>
        <span> © 2026 Latin Aviation Network.</span>
      </div>
    </div>
  </footer>
</body>
</html>
