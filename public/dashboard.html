<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Latin Aviation Network</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --black: #030305;
      --card: #0d0d12;
      --card-hover: #14141d;
      --white: #ffffff;
      --white-soft: #cbd5e1;
      --gray: #64748b;
      --blue: #0066ff;
      --blue-light: #3399ff;
      --cyan: #00d4ff;
      --blue-glow: rgba(0, 102, 255, 0.45);
      --border: #1f2937;
      --radius: 20px;
      --transition: 0.45s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--black);
      color: var(--white);
      line-height: 1.7;
      overflow-x: hidden;
    }
    a { text-decoration: none; color: inherit; }
    ul { list-style: none; }
    img { max-width: 100%; display: block; }
    .container { max-width: 1100px; margin: 0 auto; padding: 0 24px; }

    /* Fondo animado */
    .bg-mesh {
      position: fixed; inset: 0; z-index: -2;
      background:
        radial-gradient(circle at 25% 30%, rgba(0, 102, 255, 0.18) 0%, transparent 45%),
        radial-gradient(circle at 75% 70%, rgba(0, 212, 255, 0.12) 0%, transparent 45%);
      background-attachment: fixed;
      animation: meshMove 18s ease-in-out infinite alternate;
    }
    @keyframes meshMove {
      0% { background-position: 0% 0%, 100% 100%; }
      100% { background-position: 100% 100%, 0% 0%; }
    }

    /* Navbar */
    nav {
      position: sticky; top: 0; z-index: 100;
      backdrop-filter: blur(18px);
      background: rgba(3, 3, 5, 0.82);
      border-bottom: 1px solid var(--border);
      padding: 1rem 0;
      transition: var(--transition);
    }
    nav.scrolled { background: rgba(2, 2, 4, 0.95); box-shadow: 0 4px 30px rgba(0,0,0,0.4); }
    .nav-inner {
      display: flex; justify-content: space-between; align-items: center;
    }
    .logo-box {
      display: flex; align-items: center; gap: 10px;
    }
    .logo-img {
      width: 36px;
      height: 36px;
      object-fit: contain;
    }
    .logo-text {
      font-family: 'Orbitron', monospace; font-weight: 900; font-size: 1.3rem;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, var(--white), var(--blue));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .btn-discord {
      background: linear-gradient(135deg, var(--blue), var(--blue-light));
      color: var(--white);
      padding: 10px 24px;
      border-radius: 50px;
      font-weight: 800;
      font-size: 0.9rem;
      box-shadow: 0 10px 30px var(--blue-glow);
      transition: var(--transition);
      border: none;
      cursor: pointer;
    }
    .btn-discord:hover {
      transform: translateY(-3px);
      box-shadow: 0 20px 40px rgba(0,102,255,0.6);
      filter: brightness(1.1);
    }

    /* Dashboard card */
    .dashboard {
      min-height: 92vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
    }
    .dashboard-card {
      background: rgba(13, 13, 18, 0.7);
      backdrop-filter: blur(22px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: var(--radius);
      padding: 70px 50px;
      max-width: 520px;
      box-shadow: 0 35px 70px rgba(0,0,0,0.7);
      position: relative; z-index: 10;
      animation: cardFloat 6s ease-in-out infinite, cardGlow 4s ease-in-out infinite;
    }
    @keyframes cardFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }
    @keyframes cardGlow {
      0%, 100% { box-shadow: 0 35px 70px rgba(0,0,0,0.7), 0 0 0 rgba(0,102,255,0); }
      50% { box-shadow: 0 35px 70px rgba(0,0,0,0.7), 0 0 50px rgba(0,102,255,0.3); }
    }
    .dashboard-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      border-radius: inherit; padding: 1px;
      background: linear-gradient(135deg, var(--blue), var(--cyan));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: destination-out;
      mask-composite: exclude;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.4s;
    }
    .dashboard-card:hover::before { opacity: 1; }

    .dashboard-eyebrow {
      display: inline-block;
      font-family: 'Orbitron', monospace;
      font-size: 0.75rem;
      font-weight: 900;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: var(--blue);
      margin-bottom: 18px;
      padding: 6px 18px;
      border: 1px solid rgba(0, 102, 255, 0.35);
      border-radius: 50px;
      background: rgba(0, 102, 255, 0.1);
      box-shadow: 0 0 20px rgba(0, 102, 255, 0.25);
      animation: glowPulse 3s ease-in-out infinite;
    }
    @keyframes glowPulse {
      0%, 100% { box-shadow: 0 0 15px rgba(0,102,255,0.25); border-color: rgba(0,102,255,0.35); }
      50% { box-shadow: 0 0 35px rgba(0,102,255,0.55); border-color: var(--blue); }
    }
    .dashboard h1 {
      font-family: 'Orbitron', monospace;
      font-size: clamp(2rem, 6vw, 3.2rem);
      font-weight: 900;
      margin-bottom: 10px;
      letter-spacing: -1px;
      background: linear-gradient(135deg, var(--white) 0%, var(--blue) 60%, var(--blue-light) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 4px 10px rgba(0,102,255,0.3));
    }
    .dashboard .subtitle {
      color: var(--white-soft);
      font-size: 1.1rem;
      margin-bottom: 30px;
    }
    .user-profile {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      margin: 30px 0;
    }
    .avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: 3px solid var(--blue);
      object-fit: cover;
      box-shadow: 0 0 30px var(--blue-glow);
      animation: avatarPulse 2s ease-in-out infinite;
    }
    @keyframes avatarPulse {
      0%, 100% { box-shadow: 0 0 30px var(--blue-glow); }
      50% { box-shadow: 0 0 50px var(--blue-glow); }
    }
    .user-info {
      text-align: left;
    }
    .user-info .username {
      font-family: 'Orbitron', monospace;
      font-size: 1.2rem;
      font-weight: 900;
      color: var(--white);
      display: block;
    }
    .user-info .user-id {
      font-size: 0.9rem;
      color: var(--gray);
      display: block;
      margin-top: 4px;
    }
    .user-actions {
      display: flex;
      gap: 14px;
      justify-content: center;
      margin-top: 34px;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-flex; align-items: center; gap: 10px;
      padding: 14px 30px; border-radius: 50px;
      font-weight: 800; font-size: 0.95rem;
      transition: var(--transition); border: none; cursor: pointer;
    }
    .btn-danger {
      background: rgba(255, 255, 255, 0.05);
      color: var(--white);
      border: 1px solid var(--border);
    }
    .btn-danger:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: var(--blue);
      transform: translateY(-3px);
    }
    .btn-ghost {
      background: transparent; color: var(--white-soft);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover {
      border-color: var(--blue); color: var(--blue);
      transform: translateY(-3px);
    }

    footer {
      border-top: 1px solid var(--border);
      background: var(--black);
      padding: 20px 20px 25px;
      text-align: center;
    }
    .footer-bottom {
      color: var(--gray);
      font-size: 0.85rem;
    }
    .version {
      background: var(--card);
      border: 1px solid var(--border);
      padding: 4px 12px;
      border-radius: 6px;
      font-family: 'Orbitron', monospace;
      font-size: 0.75rem;
      color: var(--blue);
    }

    @media (max-width: 768px) {
      .dashboard-card { padding: 50px 24px; }
      .avatar { width: 80px; height: 80px; }
      .logo-box { gap: 8px; }
      .logo-img { width: 30px; height: 30px; }
      .logo-text { font-size: 1.1rem; }
    }
  </style>
</head>
<body>

  <div class="bg-mesh"></div>

  <nav id="navbar">
    <div class="nav-inner container">
      <div class="logo-box">
        <img src="https://i.imgur.com/V47UGra.png" alt="LAN Logo" class="logo-img" onerror="this.style.display='none'">
        <div class="logo-text">LATIN AVIATION NETWORK</div>
      </div>
      <a href="/auth/logout" class="btn-discord">Cerrar sesión</a>
    </div>
  </nav>

  <main class="dashboard">
    <div class="container">
      <div class="dashboard-card">
        <span class="dashboard-eyebrow">Panel de usuario</span>
        <h1 id="welcome-name">Bienvenido</h1>
        <p class="subtitle">Sesión iniciada correctamente con Discord</p>
        <div class="user-profile">
          <img id="user-avatar" class="avatar" alt="Avatar de Discord" src="https://cdn.discordapp.com/embed/avatars/0.png">
          <div class="user-info">
            <span class="username" id="username">Cargando...</span>
            <span class="user-id" id="user-id">ID: —</span>
          </div>
        </div>
        <div class="user-actions">
          <a href="/" class="btn btn-ghost">Volver al inicio</a>
          <a href="/auth/logout" class="btn btn-danger">Cerrar sesión</a>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <div class="container">
      <div class="footer-bottom">
        <div class="version">0.0.0.0.1</div>
        <p>&copy; 2026 Latin Aviation Network. Todos los derechos reservados.</p>
      </div>
    </div>
  </footer>

  <script>
    const navbar = document.getElementById('navbar');
    window.addEventListener('scroll', () => {
      if (window.scrollY > 50) navbar.classList.add('scrolled');
      else navbar.classList.remove('scrolled');
    });

    async function loadUser() {
      try {
        const res = await fetch('/api/me');
        if (res.status === 401) {
          window.location.href = '/iniciar-seccion.html';
          return;
        }
        const user = await res.json();
        document.getElementById('welcome-name').textContent = 'Bienvenido, ' + (user.global_name || user.username);
        document.getElementById('username').textContent = user.global_name || user.username;
        document.getElementById('user-id').textContent = 'ID: ' + user.id;
        if (user.avatar) {
          document.getElementById('user-avatar').src = `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png`;
        }
      } catch (e) {
        console.error('Error cargando usuario:', e);
        window.location.href = '/iniciar-seccion.html';
      }
    }

    loadUser();
  </script>
</body>
</html>
