<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Latin Aviation Network</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --black: #030305;
      --card: #0d0d12;
      --white: #ffffff;
      --white-soft: #cbd5e1;
      --gray: #64748b;
      --blue: #0066ff;
      --blue-light: #3399ff;
      --cyan: #00d4ff;
      --blue-glow: rgba(0, 102, 255, 0.45);
      --border: #1f2937;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--black);
      color: var(--white);
      line-height: 1.5;
      overflow-x: hidden;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }
    a { text-decoration: none; color: inherit; }
    img { max-width: 100%; display: block; }
    .container { max-width: 1100px; margin: 0 auto; padding: 0 24px; width: 100%; }

    .bg-dashboard {
      position: fixed; inset: 0; z-index: -2;
      background-size: cover;
      background-position: center;
      background-image: linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.75)),
        url("https://i.imgur.com/rjEhr3O.jpeg");
    }

    /* ===== BARRA SUPERIOR (compacta) ===== */
    nav {
      position: relative;
      z-index: 100;
      overflow: hidden;
      background:
        radial-gradient(600px 200px at 8% 0%, rgba(0,102,255,0.28), transparent 70%),
        radial-gradient(400px 160px at 100% 100%, rgba(0,212,255,0.12), transparent 70%),
        linear-gradient(180deg, rgba(8,10,18,0.96), rgba(3,3,5,0.94));
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(0,102,255,0.35);
      border-radius: 0 0 28px 28px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.6), 0 8px 36px rgba(0,102,255,0.15);
      padding: 20px 0 18px;
    }
    nav::before {
      content: "";
      position: absolute;
      right: -120px; top: -150px;
      width: 320px; height: 320px;
      border-radius: 50%;
      border: 1px solid rgba(0,212,255,0.14);
      box-shadow:
        0 0 0 40px rgba(0,102,255,0.03),
        0 0 0 41px rgba(0,212,255,0.09);
      pointer-events: none;
    }
    nav::after {
      content: "";
      position: absolute; left: 8%; right: 8%; bottom: 0; height: 2px;
      background: linear-gradient(90deg, transparent, var(--blue), var(--cyan), var(--blue), transparent);
      opacity: 0.9;
    }
    .nav-inner {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .nav-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    /* Izquierda */
    .nav-profile {
      display: flex;
      align-items: center;
      gap: 18px;
      min-width: 0;
      flex: 1;
    }
    .avatar-wrap {
      position: relative;
      flex-shrink: 0;
      padding: 4px;
      border-radius: 50%;
      background: conic-gradient(from 160deg, var(--blue), var(--cyan), var(--blue-light), var(--blue));
      box-shadow: 0 0 30px var(--blue-glow);
    }
    .nav-avatar {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      border: 3px solid var(--black);
      object-fit: cover;
      background: var(--card);
    }
    .status-dot {
      position: absolute;
      right: 4px; bottom: 4px;
      width: 15px; height: 15px;
      border-radius: 50%;
      background: #22c55e;
      border: 3px solid var(--black);
      box-shadow: 0 0 10px rgba(34,197,94,0.8);
    }
    .nav-info { min-width: 0; }
    .nav-brand {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: 'Orbitron', monospace;
      font-size: 0.56rem;
      font-weight: 900;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--cyan);
      margin-bottom: 4px;
      padding: 3px 11px;
      border: 1px solid rgba(0,212,255,0.28);
      border-radius: 50px;
      background: rgba(0,212,255,0.07);
      max-width: 100%;
    }
    .nav-brand svg { width: 11px; height: 11px; fill: currentColor; flex-shrink: 0; }
    .nav-welcome {
      font-family: 'Orbitron', monospace;
      font-size: clamp(1.05rem, 2.8vw, 1.6rem);
      font-weight: 900;
      line-height: 1.2;
      letter-spacing: -0.3px;
      margin-bottom: 6px;
      background: linear-gradient(135deg, var(--white) 30%, var(--cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      overflow-wrap: anywhere;
    }
    .nav-id {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      max-width: 100%;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--white-soft);
      background: rgba(88,101,242,0.14);
      border: 1px solid rgba(88,101,242,0.45);
      padding: 2px 12px 2px 8px;
      border-radius: 9px;
    }
    .nav-id svg { width: 14px; height: 14px; fill: #8b94ff; flex-shrink: 0; }
    .nav-id span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* Derecha */
    .logout-link {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 16px;
      border-radius: 18px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      transition: 0.3s;
    }
    .logout-link img {
      width: 46px;
      height: 46px;
      object-fit: contain;
      filter: drop-shadow(0 0 10px var(--blue-glow));
    }
    .logout-link .logout-text {
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: var(--white-soft);
    }
    .logout-link:hover {
      transform: translateY(-2px);
      border-color: var(--blue);
      background: rgba(0,102,255,0.12);
      box-shadow: 0 8px 24px var(--blue-glow);
    }

    /* Abajo: Roblox */
    .nav-bottom { display: flex; }
    .btn-roblox {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      background: linear-gradient(135deg, var(--blue), var(--blue-light));
      color: var(--white);
      padding: 10px 24px;
      border-radius: 14px;
      font-family: inherit;
      font-weight: 800;
      font-size: 0.88rem;
      border: 1px solid rgba(255,255,255,0.18);
      cursor: pointer;
      transition: 0.3s;
      box-shadow: 0 8px 22px var(--blue-glow);
    }
    .btn-roblox svg { width: 17px; height: 17px; fill: currentColor; }
    .btn-roblox:hover { transform: translateY(-2px); filter: brightness(1.12); }
    a:focus-visible, button:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }

    /* Modal Roblox */
    .modal-overlay {
      position: fixed; inset: 0; z-index: 1000;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-overlay.active { display: flex; }
    .modal-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 40px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      box-shadow: 0 30px 60px rgba(0,0,0,0.8);
    }
    .modal-card .roblox-avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: 3px solid var(--blue);
      margin: 0 auto 20px;
    }
    .modal-card h3 {
      font-family: 'Orbitron', monospace;
      font-size: 1.5rem;
      margin-bottom: 8px;
      color: var(--white);
      overflow-wrap: anywhere;
    }
    .modal-card p { color: var(--gray); margin-bottom: 25px; }
    .modal-close {
      background: var(--blue);
      color: #fff;
      border: none;
      padding: 12px 24px;
      border-radius: 50px;
      font-weight: 800;
      cursor: pointer;
    }
    .modal-close:hover { background: var(--blue-light); }

    /* Footer siempre abajo */
    footer {
      margin-top: auto;
      border-top: 1px solid var(--border);
      background: var(--black);
      padding: 20px 0;
      text-align: center;
    }
    .footer-text {
      color: var(--gray);
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px 12px;
    }
    .version {
      background: var(--card);
      border: 1px solid var(--border);
      padding: 3px 10px;
      border-radius: 6px;
      font-family: 'Orbitron', monospace;
      font-size: 0.7rem;
      color: var(--blue);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 768px) {
      .container { padding: 0 16px; }
      nav { padding: 16px 0 14px; border-radius: 0 0 22px 22px; }
      .nav-profile { gap: 14px; }
      .nav-avatar { width: 64px; height: 64px; }
      .status-dot { width: 13px; height: 13px; }
      .logout-link { padding: 8px 12px; }
      .logout-link img { width: 38px; height: 38px; }
      .logout-link .logout-text { display: none; }
    }
    @media (max-width: 480px) {
      .nav-inner { gap: 12px; }
      .nav-profile { gap: 12px; }
      .nav-avatar { width: 54px; height: 54px; border-width: 2px; }
      .nav-brand { font-size: 0.48rem; letter-spacing: 1.5px; padding: 2px 8px; }
      .nav-id { font-size: 0.7rem; }
      .logout-link { padding: 6px 9px; border-radius: 14px; }
      .logout-link img { width: 32px; height: 32px; }
      .nav-bottom .btn-roblox { width: 100%; }
      .modal-card { padding: 28px 20px; }
    }
    @media (max-width: 340px) {
      .nav-brand { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>

  <div class="bg-dashboard"></div>

  <nav id="navbar">
    <div class="nav-inner container">

      <div class="nav-top">
        <!-- IZQUIERDA: foto + saludo + ID de Discord -->
        <div class="nav-profile">
          <div class="avatar-wrap">
            <img id="user-avatar" class="nav-avatar" alt="Avatar de Discord" src="https://cdn.discordapp.com/embed/avatars/0.png">
            <span class="status-dot"></span>
          </div>
          <div class="nav-info">
            <span class="nav-brand">
              <svg viewBox="0 0 24 24"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/></svg>
              Latin Aviation Network
            </span>
            <h1 class="nav-welcome" id="welcome-name">Bienvenido</h1>
            <span class="nav-id">
              <svg viewBox="0 0 24 24"><path d="M20.3 4.4A19.8 19.8 0 0 0 15.4 3l-.2.4a14 14 0 0 1 4.2 2.1 15.5 15.5 0 0 0-14.8 0A14 14 0 0 1 8.8 3.4L8.6 3a19.8 19.8 0 0 0-4.9 1.4C.6 9-.3 13.5.1 18a19.9 19.9 0 0 0 6 3l1.3-2.1a12.9 12.9 0 0 1-2-1l.5-.4a14.2 14.2 0 0 0 12.2 0l.5.4a12.9 12.9 0 0 1-2 1l1.3 2.1a19.9 19.9 0 0 0 6-3c.5-5.2-.8-9.7-3.6-13.6zM8.5 15.3c-1.200 0-2.100-1.100-2.100-2.400s.9-2.400 2.100-2.400 2.100 1.100 2.100 2.400-.9 2.400-2.100 2.400zm7 0c-1.200 0-2.100-1.100-2.100-2.400s.9-2.400 2.100-2.400 2.100 1.100 2.100 2.400-.9 2.400-2.100 2.400z"/></svg>
              <span id="user-id">ID Discord: —</span>
            </span>
          </div>
        </div>

        <!-- DERECHA: cerrar sesión -->
        <a href="/auth/logout" class="logout-link" title="Cerrar sesión">
          <img src="https://i.pinimg.com/originals/ab/23/a5/ab23a5baec3591af66206c2c14adbba8.png" alt="Cerrar sesión"
               onerror="this.style.display='none'; this.parentElement.querySelector('.logout-text').style.display='inline'">
          <span class="logout-text">Cerrar sesión</span>
        </a>
      </div>

      <!-- ABAJO: cuenta de Roblox -->
      <div class="nav-bottom">
        <button class="btn-roblox" id="btn-roblox">
          <svg viewBox="0 0 24 24"><path d="M5.2 0 0 18.8 18.8 24 24 5.2 5.2 0zm8.6 15.1-4.9-1.3 1.3-4.9 4.9 1.3-1.3 4.9z"/></svg>
          Cuenta de Roblox
        </button>
      </div>

    </div>
  </nav>

  <footer>
    <div class="container">
      <div class="footer-text">
        <span class="version">0.0.0.0.1</span>
        <span>© 2026 Latin Aviation Network. Todos los derechos reservados.</span>
      </div>
    </div>
  </footer>

  <!-- Modal Roblox -->
  <div class="modal-overlay" id="roblox-modal">
    <div class="modal-card">
      <img id="roblox-modal-avatar" class="roblox-avatar" alt="Roblox Avatar" src="https://www.roblox.com/headshot-thumbnail/image?userId=0&width=420&height=420&format=png">
      <h3 id="roblox-modal-name">Cargando...</h3>
      <p id="roblox-modal-id">ID: —</p>
      <button class="modal-close" onclick="document.getElementById('roblox-modal').classList.remove('active')">Cerrar</button>
    </div>
  </div>

  <script>
    const navbar = document.getElementById('navbar');
    window.addEventListener('scroll', () => {
      if (window.scrollY > 50) navbar.classList.add('scrolled');
      else navbar.classList.remove('scrolled');
    });

    async function loadUser() {
      try {
        const res = await fetch('/api/me');
        if (res.status === 401) {
          window.location.href = '/iniciar-seccion.html';
          return;
        }
        const user = await res.json();
        const name = user.global_name || user.username;
        document.getElementById('welcome-name').textContent = 'Bienvenido, ' + name;
        document.getElementById('user-id').textContent = 'ID Discord: ' + user.id;
        if (user.avatar) {
          document.getElementById('user-avatar').src = `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png`;
        }

        const btnRoblox = document.getElementById('btn-roblox');
        const modal = document.getElementById('roblox-modal');
        const modalAvatar = document.getElementById('roblox-modal-avatar');
        const modalName = document.getElementById('roblox-modal-name');
        const modalId = document.getElementById('roblox-modal-id');

        btnRoblox.addEventListener('click', () => {
          if (user.roblox_id) {
            modalName.textContent = user.roblox_username || 'Usuario de Roblox';
            modalId.textContent = 'ID: ' + user.roblox_id;
            modalAvatar.src = user.roblox_avatar || `https://www.roblox.com/headshot-thumbnail/image?userId=${user.roblox_id}&width=420&height=420&format=png`;
            modal.classList.add('active');
          } else {
            alert('No tienes cuenta de Roblox vinculada aún.');
          }
        });

        modal.addEventListener('click', (e) => {
          if (e.target === modal) modal.classList.remove('active');
        });
      } catch (e) {
        console.error(e);
        window.location.href = '/iniciar-seccion.html';
      }
    }

    loadUser();
  </script>
</body>
</html>
