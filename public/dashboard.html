<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Latin Aviation Network</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --black: #030305;
      --card: #0d0d12;
      --white: #ffffff;
      --white-soft: #cbd5e1;
      --gray: #64748b;
      --blue: #0066ff;
      --blue-light: #3399ff;
      --cyan: #00d4ff;
      --blue-glow: rgba(0, 102, 255, 0.45);
      --border: #1f2937;
      --radius: 24px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--black);
      color: var(--white);
      line-height: 1.7;
      overflow-x: hidden;
    }
    a { text-decoration: none; color: inherit; }
    img { max-width: 100%; display: block; }
    .container { max-width: 1100px; margin: 0 auto; padding: 0 24px; }

    .bg-dashboard {
      position: fixed; inset: 0; z-index: -2;
      background-size: cover;
      background-position: center;
      background-image: linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.75)),
        url("https://i.imgur.com/rjEhr3O.jpeg");
    }

    nav {
      position: sticky; top: 0; z-index: 100;
      backdrop-filter: blur(16px);
      background: rgba(3, 3, 5, 0.82);
      border-bottom: 1px solid var(--border);
      padding: 1rem 0;
    }
    .nav-inner {
      display: flex; justify-content: space-between; align-items: center;
    }
    .nav-left { display: flex; align-items: center; gap: 10px; }
    .nav-right { display: flex; align-items: center; gap: 12px; }
    .logo-box {
      display: flex; align-items: center; gap: 8px;
    }
    .logo-img {
      width: 34px;
      height: 34px;
      object-fit: contain;
    }
    .logo-text {
      font-family: 'Orbitron', monospace; font-weight: 900; font-size: 1.2rem;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, var(--white), var(--blue));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .btn-roblox {
      background: linear-gradient(135deg, var(--blue), var(--blue-light));
      color: var(--white);
      padding: 8px 18px;
      border-radius: 50px;
      font-weight: 700;
      font-size: 0.85rem;
      border: none;
      cursor: pointer;
      transition: 0.3s;
    }
    .btn-roblox:hover {
      transform: translateY(-2px);
      filter: brightness(1.1);
    }
    .btn-logout {
      background: transparent;
      color: var(--white-soft);
      border: 1px solid var(--border);
      padding: 8px 18px;
      border-radius: 50px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      transition: 0.3s;
    }
    .btn-logout:hover {
      border-color: var(--blue);
      color: var(--blue);
    }

    .dashboard-wrap {
      min-height: 85vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 100px 20px;
    }
    .dashboard-card {
      background: rgba(13, 13, 18, 0.75);
      backdrop-filter: blur(24px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 80px 60px;
      max-width: 750px;
      box-shadow: 0 40px 100px rgba(0,0,0,0.7);
      position: relative; z-index: 10;
      animation: fadeInUp 0.9s ease-out;
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(40px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .dashboard-eyebrow {
      display: inline-block;
      font-family: 'Orbitron', monospace;
      font-size: 0.7rem;
      font-weight: 900;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--blue);
      margin-bottom: 18px;
      padding: 6px 16px;
      border: 1px solid rgba(0, 102, 255, 0.3);
      border-radius: 50px;
      background: rgba(0, 102, 255, 0.08);
    }
    .dashboard h1 {
      font-family: 'Orbitron', monospace;
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 900;
      margin-bottom: 10px;
      letter-spacing: -1px;
      background: linear-gradient(135deg, var(--white), var(--blue));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .dashboard .subtitle {
      color: var(--white-soft);
      font-size: 1.1rem;
      margin-bottom: 40px;
    }
    .user-profile {
      display: flex;
      align-items: center;
      gap: 30px;
      margin-bottom: 50px;
      padding: 34px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 26px;
    }
    .avatar {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      border: 3px solid var(--blue);
      object-fit: cover;
      box-shadow: 0 0 50px var(--blue-glow);
      flex-shrink: 0;
    }
    .user-info {
      flex: 1;
    }
    .user-info .username {
      font-family: 'Orbitron', monospace;
      font-size: 1.6rem;
      font-weight: 900;
      color: var(--white);
      display: block;
      margin-bottom: 8px;
    }
    .user-info .user-id {
      font-size: 1.1rem;
      color: var(--gray);
      display: block;
    }
    .user-actions {
      display: flex;
      gap: 14px;
      justify-content: flex-start;
      margin-top: 20px;
    }
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 14px 28px; border-radius: 50px;
      font-weight: 800; font-size: 0.9rem;
      transition: 0.3s; border: none; cursor: pointer;
    }
    .btn-ghost {
      background: transparent; color: var(--white-soft);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover { border-color: var(--blue); color: var(--blue); transform: translateY(-2px); }

    /* Modal Roblox */
    .modal-overlay {
      position: fixed; inset: 0; z-index: 1000;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.active { display: flex; }
    .modal-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 40px;
      max-width: 400px;
      width: 90%;
      text-align: center;
      box-shadow: 0 30px 60px rgba(0,0,0,0.8);
    }
    .modal-card .roblox-avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: 3px solid var(--blue);
      margin-bottom: 20px;
    }
    .modal-card h3 {
      font-family: 'Orbitron', monospace;
      font-size: 1.5rem;
      margin-bottom: 8px;
      color: var(--white);
    }
    .modal-card p {
      color: var(--gray);
      margin-bottom: 25px;
    }
    .modal-close {
      background: var(--blue);
      color: #fff;
      border: none;
      padding: 12px 24px;
      border-radius: 50px;
      font-weight: 800;
      cursor: pointer;
    }
    .modal-close:hover { background: var(--blue-light); }

    footer {
      border-top: 1px solid var(--border);
      background: var(--black);
      padding: 20px 0;
      text-align: center;
    }
    .footer-text {
      color: var(--gray);
      font-size: 0.8rem;
    }
    .version {
      background: var(--card);
      border: 1px solid var(--border);
      padding: 3px 10px;
      border-radius: 6px;
      font-family: 'Orbitron', monospace;
      font-size: 0.7rem;
      color: var(--blue);
    }

    @media (max-width: 768px) {
      .dashboard-card { padding: 45px 24px; }
      .avatar { width: 100px; height: 100px; }
      .logo-text { font-size: 1rem; }
    }
  </style>
</head>
<body>

  <div class="bg-dashboard"></div>

  <nav>
    <div class="nav-inner container">
      <div class="nav-left">
        <div class="logo-box">
          <img src="https://i.imgur.com/V47UGra.png" alt="LAN Logo" class="logo-img" onerror="this.style.display='none'">
          <div class="logo-text">LATIN AVIATION NETWORK</div>
        </div>
      </div>
      <div class="nav-right">
        <button class="btn-roblox" id="btn-roblox">Cuenta de Roblox</button>
        <button class="btn-logout" onclick="window.location.href='/auth/logout'">Cerrar sesión</button>
      </div>
    </div>
  </nav>

  <main class="dashboard-wrap">
    <div class="container">
      <div class="dashboard-card">
        <span class="dashboard-eyebrow">Panel de usuario</span>
        <h1 id="welcome-name">Bienvenido</h1>
        <p class="subtitle" id="welcome-sub">Sesión iniciada correctamente con Discord</p>
        <div class="user-profile">
          <img id="user-avatar" class="avatar" alt="Avatar de Discord" src="https://cdn.discordapp.com/embed/avatars/0.png">
          <div class="user-info">
            <span class="username" id="username">Cargando...</span>
            <span class="user-id" id="user-id">ID: —</span>
          </div>
        </div>
        <div class="user-actions">
          <a href="/" class="btn btn-ghost">Volver al inicio</a>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <div class="container">
      <div class="footer-text">
        <span class="version">0.0.0.0.1</span>
        <span>© 2026 Latin Aviation Network. Todos los derechos reservados.</span>
      </div>
    </div>
  </footer>

  <!-- Modal Roblox -->
  <div class="modal-overlay" id="roblox-modal">
    <div class="modal-card">
      <img id="roblox-modal-avatar" class="roblox-avatar" alt="Roblox Avatar" src="https://www.roblox.com/headshot-thumbnail/image?userId=0&width=420&height=420&format=png">
      <h3 id="roblox-modal-name">Cargando...</h3>
      <p id="roblox-modal-id">ID: —</p>
      <button class="modal-close" onclick="document.getElementById('roblox-modal').classList.remove('active')">Cerrar</button>
    </div>
  </div>

  <script>
    const navbar = document.getElementById('navbar');
    window.addEventListener('scroll', () => {
      if (window.scrollY > 50) navbar.classList.add('scrolled');
      else navbar.classList.remove('scrolled');
    });

    async function loadUser() {
      try {
        const res = await fetch('/api/me');
        if (res.status === 401) {
          window.location.href = '/iniciar-seccion.html';
          return;
        }
        const user = await res.json();
        const name = user.global_name || user.username;
        document.getElementById('welcome-name').textContent = 'Bienvenido, ' + name;
        document.getElementById('username').textContent = name;
        document.getElementById('user-id').textContent = 'ID: ' + user.id;
        if (user.avatar) {
          document.getElementById('user-avatar').src = `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png`;
        }

        const btnRoblox = document.getElementById('btn-roblox');
        const modal = document.getElementById('roblox-modal');
        const modalAvatar = document.getElementById('roblox-modal-avatar');
        const modalName = document.getElementById('roblox-modal-name');
        const modalId = document.getElementById('roblox-modal-id');

        btnRoblox.addEventListener('click', () => {
          if (user.roblox_id) {
            modalName.textContent = user.roblox_username || 'Usuario de Roblox';
            modalId.textContent = 'ID: ' + user.roblox_id;
            modalAvatar.src = user.roblox_avatar || `https://www.roblox.com/headshot-thumbnail/image?userId=${user.roblox_id}&width=420&height=420&format=png`;
            modal.classList.add('active');
          } else {
            alert('No tienes cuenta de Roblox vinculada aún.');
          }
        });

        modal.addEventListener('click', (e) => {
          if (e.target === modal) modal.classList.remove('active');
        });
      } catch (e) {
        console.error(e);
        window.location.href = '/iniciar-seccion.html';
      }
    }

    loadUser();
  </script>
</body>
</html>
