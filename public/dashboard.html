<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Latin Aviation Network</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --black: #030305;
      --card: #0d0d12;
      --white: #ffffff;
      --white-soft: #cbd5e1;
      --gray: #64748b;
      --blue: #0066ff;
      --blue-light: #3399ff;
      --blue-glow: rgba(0, 102, 255, 0.45);
      --border: #1f2937;
      --radius: 24px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--black);
      color: var(--white);
      line-height: 1.7;
      overflow-x: hidden;
    }
    a { text-decoration: none; color: inherit; }
    ul { list-style: none; }
    img { max-width: 100%; display: block; }
    .container { max-width: 1100px; margin: 0 auto; padding: 0 24px; }

    /* Fondo del dashboard con tu foto */
    .bg-dashboard {
      position: fixed; inset: 0; z-index: -2;
      background-size: cover;
      background-position: center;
      background-image: linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.75)),
        url("https://i.imgur.com/rjEhr3O.jpeg");
    }

    /* Navbar */
    nav {
      position: sticky; top: 0; z-index: 100;
      backdrop-filter: blur(16px);
      background: rgba(3, 3, 5, 0.82);
      border-bottom: 1px solid var(--border);
      padding: 1rem 0;
    }
    .nav-inner {
      display: flex; justify-content: space-between; align-items: center;
    }
    .nav-left { display: flex; align-items: center; gap: 16px; }
    .nav-right { display: flex; align-items: center; gap: 12px; }
    .logo-box {
      display: flex; align-items: center; gap: 8px;
    }
    .logo-img {
      width: 32px;
      height: 32px;
      object-fit: contain;
    }
    .logo-text {
      font-family: 'Orbitron', monospace; font-weight: 900; font-size: 1.1rem;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, var(--white), var(--blue));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .btn-logout {
      background: transparent;
      color: var(--white-soft);
      border: 1px solid var(--border);
      padding: 8px 16px;
      border-radius: 50px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      transition: 0.3s;
    }
    .btn-logout:hover {
      border-color: var(--blue);
      color: var(--blue);
    }

    /* Dashboard más largo y espacioso */
    .dashboard-wrap {
      min-height: 90vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 80px 20px;
    }
    .dashboard-card {
      background: rgba(13, 13, 18, 0.7);
      backdrop-filter: blur(24px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 70px 60px;
      max-width: 700px;
      box-shadow: 0 40px 90px rgba(0,0,0,0.7);
      position: relative; z-index: 10;
      animation: fadeInUp 0.9s ease-out;
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(40px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .dashboard-eyebrow {
      display: inline-block;
      font-family: 'Orbitron', monospace;
      font-size: 0.7rem;
      font-weight: 900;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--blue);
      margin-bottom: 22px;
      padding: 6px 16px;
      border: 1px solid rgba(0, 102, 255, 0.3);
      border-radius: 50px;
      background: rgba(0, 102, 255, 0.08);
    }
    .dashboard h1 {
      font-family: 'Orbitron', monospace;
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 900;
      margin-bottom: 10px;
      letter-spacing: -1px;
      background: linear-gradient(135deg, var(--white), var(--blue));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .dashboard .subtitle {
      color: var(--white-soft);
      font-size: 1.1rem;
      margin-bottom: 38px;
    }
    .user-profile {
      display: flex;
      align-items: center;
      gap: 26px;
      margin-bottom: 42px;
      padding: 28px;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 22px;
    }
    .avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 3px solid var(--blue);
      object-fit: cover;
      box-shadow: 0 0 50px var(--blue-glow);
      flex-shrink: 0;
    }
    .user-info {
      flex: 1;
    }
    .user-info .username {
      font-family: 'Orbitron', monospace;
      font-size: 1.5rem;
      font-weight: 900;
      color: var(--white);
      display: block;
      margin-bottom: 6px;
    }
    .user-info .user-id {
      font-size: 1rem;
      color: var(--gray);
      display: block;
    }
    .user-actions {
      display: flex;
      gap: 14px;
      justify-content: flex-start;
      margin-top: 12px;
    }
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 14px 28px; border-radius: 50px;
      font-weight: 800; font-size: 0.9rem;
      transition: 0.3s; border: none; cursor: pointer;
    }
    .btn-ghost {
      background: transparent; color: var(--white-soft);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover { border-color: var(--blue); color: var(--blue); transform: translateY(-2px); }

    footer {
      border-top: 1px solid var(--border);
      background: var(--black);
      padding: 20px 0;
      text-align: center;
    }
    .footer-text {
      color: var(--gray);
      font-size: 0.8rem;
    }
    .version {
      background: var(--card);
      border: 1px solid var(--border);
      padding: 3px 10px;
      border-radius: 6px;
      font-family: 'Orbitron', monospace;
      font-size: 0.7rem;
      color: var(--blue);
    }

    @media (max-width: 768px) {
      .dashboard-card { padding: 45px 24px; }
      .avatar { width: 90px; height: 90px; }
      .logo-text { font-size: 1rem; }
    }
  </style>
</head>
<body>

  <div class="bg-dashboard"></div>

  <nav>
    <div class="nav-inner container">
      <div class="nav-left">
        <a href="/auth/logout" class="btn-logout">Cerrar sesión</a>
      </div>
      <div class="nav-right">
        <div class="logo-box">
          <img src="https://i.imgur.com/V47UGra.png" alt="LAN Logo" class="logo-img" onerror="this.style.display='none'">
          <div class="logo-text">LATIN AVIATION NETWORK</div>
        </div>
      </div>
    </div>
  </nav>

  <main class="dashboard-wrap">
    <div class="container">
      <div class="dashboard-card">
        <span class="dashboard-eyebrow">Panel de usuario</span>
        <h1 id="welcome-name">Bienvenido</h1>
        <p class="subtitle" id="welcome-sub">Sesión iniciada correctamente con Discord</p>
        <div class="user-profile">
          <img id="user-avatar" class="avatar" alt="Avatar de Discord" src="https://cdn.discordapp.com/embed/avatars/0.png">
          <div class="user-info">
            <span class="username" id="username">Cargando...</span>
            <span class="user-id" id="user-id">ID: —</span>
          </div>
        </div>
        <div class="user-actions">
          <a href="/" class="btn btn-ghost">Volver al inicio</a>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <div class="container">
      <div class="footer-text">
        <span class="version">0.0.0.0.1</span>
        <span>© 2026 Latin Aviation Network. Todos los derechos reservados.</p>
      </div>
    </div>
  </footer>

  <script>
    async function loadUser() {
      try {
        const res = await fetch('/api/me');
        if (res.status === 401) {
          window.location.href = '/iniciar-seccion.html';
          return;
        }
        const user = await res.json();
        const name = user.global_name || user.username;
        document.getElementById('welcome-name').textContent = 'Bienvenido, ' + name;
        document.getElementById('username').textContent = name;
        document.getElementById('user-id').textContent = 'ID: ' + user.id;
        if (user.avatar) {
          document.getElementById('user-avatar').src = `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png`;
        }
      } catch (e) {
        console.error('Error cargando usuario:', e);
        window.location.href = '/iniciar-seccion.html';
      }
    }

    loadUser();
  </script>
</body>
</html>
