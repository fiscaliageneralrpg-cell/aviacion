<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cargando | Latin Aviation Network</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Orbitron', monospace;
      background: #000;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .loader-card {
      text-align: center;
      background: rgba(13, 13, 18, 0.85);
      border: 1px solid #1f2937;
      border-radius: 24px;
      padding: 60px 40px;
      box-shadow: 0 30px 80px rgba(0,0,0,0.7);
      backdrop-filter: blur(12px);
      max-width: 450px;
    }
    .avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 3px solid #0066ff;
      margin-bottom: 20px;
      box-shadow: 0 0 40px rgba(0,102,255,0.5);
    }
    .welcome-text {
      font-size: clamp(1.5rem, 5vw, 2.5rem);
      font-weight: 900;
      color: #fff;
      margin-bottom: 12px;
      letter-spacing: -1px;
      background: linear-gradient(135deg, #fff, #0066ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .sub-text {
      color: #94a3b8;
      font-size: 1rem;
      margin-bottom: 30px;
    }
    .loader {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(0,102,255,0.3);
      border-top: 3px solid #0066ff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    .countdown {
      color: #0066ff;
      font-size: 1.2rem;
      font-weight: 800;
      margin-top: 15px;
    }
    .verify-now {
      margin-top: 25px;
      display: none;
    }
    .btn-verify {
      background: linear-gradient(135deg, #0066ff, #3399ff);
      color: #fff;
      padding: 14px 30px;
      border-radius: 50px;
      font-weight: 800;
      text-decoration: none;
      display: inline-block;
      box-shadow: 0 10px 30px rgba(0,102,255,0.5);
      transition: 0.3s;
    }
    .btn-verify:hover { transform: translateY(-3px); filter: brightness(1.1); }
  </style>
</head>
<body>

  <div class="loader-card">
    <img id="avatar" class="avatar" alt="Avatar" src="https://cdn.discordapp.com/embed/avatars/0.png">
    <div class="welcome-text" id="welcome-name">Bienvenido</div>
    <div class="sub-text" id="sub-text">Cargando perfil...</div>
    <div class="loader"></div>
    <div class="countdown" id="countdown">...</div>
    
    <div class="verify-now" id="verify-now">
      <div style="color:#0066ff; font-weight:800; margin-bottom:10px;">Primero debes verificarte</div>
      <a href="/verificacion.html" class="btn-verify">Ir a Verificación →</a>
    </div>
  </div>

  <script>
    async function init() {
      try {
        const res = await fetch('/api/me');
        if (res.status === 401) {
          window.location.href = '/iniciar-seccion.html';
          return;
        }
        const user = await res.json();
        const name = user.global_name || user.username;
        document.getElementById('welcome-name').textContent = 'Bienvenido, ' + name;
        if (user.avatar) {
          document.getElementById('avatar').src = `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png`;
        }

        const statusRes = await fetch('/api/user-status');
        const status = await statusRes.json();

        if (status.fully_verified) {
          document.getElementById('sub-text').textContent = 'Accediendo al panel...';
          document.querySelector('.loader').style.display = 'none';
          document.getElementById('countdown').textContent = 'Redirigiendo al panel...';
          setTimeout(() => { window.location.href = '/dashboard'; }, 2000);
          return;
        }

        document.getElementById('sub-text').textContent = 'Debes completar la verificación para continuar.';
        document.querySelector('.loader').style.display = 'none';
        document.getElementById('verify-now').style.display = 'block';
      } catch (e) {
        console.error(e);
        window.location.href = '/iniciar-seccion.html';
      }
    }

    init();
  </script>
</body>
</html>
